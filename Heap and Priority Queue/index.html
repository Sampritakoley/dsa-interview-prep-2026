<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heap / Priority Queue: Interview Master List</title>

<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--fg:#e8ede9;--mut:#9aa6a0;--card:#1c2420;--line:#2e3832;--acc:#4fc3a1;--e:#5cc98a;--m:#e0a84a;--h:#f07a6c;--chip:#26302b}}
:root[data-theme="dark"]{--bg:#141a17;--fg:#e8ede9;--mut:#9aa6a0;--card:#1c2420;--line:#2e3832;--acc:#4fc3a1;--e:#5cc98a;--m:#e0a84a;--h:#f07a6c;--chip:#26302b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:20px 14px 60px}
h1{font:700 clamp(26px,5vw,40px)/1.1 Newsreader,Georgia,serif;margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 16px;max-width:70ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-weight:600}
.track{flex:1;height:8px;background:var(--chip);border-radius:9px;overflow:hidden}
.fill{height:100%;width:0;background:var(--acc);transition:width .25s}
.ctl{display:flex;flex-wrap:wrap;gap:8px}
input,select,button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input[type=search]{flex:1;min-width:180px}
button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
details{margin-top:22px}
summary{cursor:pointer;font:700 21px Newsreader,Georgia,serif;padding:6px 0;display:flex;gap:10px;align-items:baseline}
summary small{font:500 13px Inter;color:var(--mut)}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--mut);font-size:13px;background:var(--chip)}
tr:last-child td{border-bottom:0}
tr.done td{opacity:.55}tr.done .q{text-decoration:line-through}
.q{font-weight:500}.q a{color:var(--acc)}
.d-E{color:var(--e)}.d-M{color:var(--m)}.d-H{color:var(--h)}.d-E,.d-M,.d-H{font-weight:600}
.co{display:flex;flex-wrap:wrap;gap:4px}.co span{background:var(--chip);border-radius:5px;padding:0 6px;font-size:12px;white-space:nowrap}
.f{white-space:nowrap}.f i{display:inline-block;width:6px;height:12px;margin-right:2px;border-radius:2px;background:var(--line)}.f i.on{background:var(--acc)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
.none{padding:30px;text-align:center;color:var(--mut)}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style></head><body><main>
<h1>Heap / Priority Queue: master list</h1>
<p class="sub">Every heap and priority-queue interview question compiled from public interview reports, grouped by pattern. Tick a question when you finish it; your progress is saved on this device. Company tags come from candidate reports and may be incomplete.</p>
<div class="bar">
<div class="prog"><span id="pt">0 / 0 done</span><div class="track"><div class="fill" id="pf"></div></div></div>
<div class="ctl">
<input type="search" id="q" placeholder="Search question or company">
<select id="sc"><option value="core">Core list (Frequent and Very Frequent)</option><option value="all">Everything</option></select>
<select id="fd"><option value="">All difficulty</option><option value="E">Easy</option><option value="M">Medium</option><option value="H">Hard</option></select>
<select id="ff"><option value="">All frequency</option><option value="V">Very Frequent</option><option value="F">Frequent</option><option value="O">Occasional</option><option value="R">Rare</option></select>
<select id="fc"><option value="">All companies</option></select>
<select id="fs"><option value="">Done and pending</option><option value="p">Pending only</option><option value="d">Done only</option></select>
<select id="so"><option value="">Default order</option><option value="f">Most frequent first</option></select>
<button id="rs">Reset progress</button>
</div></div>
<div id="out"></div>
</main>

const $=id=>document.getElementById(id);
let done=new Set();
try{done=new Set(JSON.parse(localStorage.getItem("heapdone")||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem("heapdone",JSON.stringify([...done]))}catch(e){}};
let n=0;const D=S.map(([t,r])=>[t,r.map(s=>{const[a,d,l,f,c]=s.split("|");return{id:n++,a,d,l,f,c:c.split(" ").map(x=>CO[x]||x)}})]);
const all=D.flatMap(x=>x[1]);
[...new Set(all.flatMap(x=>x.c))].sort().forEach(c=>{const o=document.createElement("option");o.value=o.textContent=c;$("fc").appendChild(o)});
function prog(){const sc=all.filter(x=>$("sc").value=="all"||x.f=="V"||x.f=="F"),t=sc.length,k=sc.filter(x=>done.has(x.id)).length;$("pt").textContent=k+" / "+t+" done";$("pf").style.width=(100*k/t)+"%"}
function render(){
const q=$("q").value.toLowerCase(),fd=$("fd").value,ff=$("ff").value,fc=$("fc").value,fs=$("fs").value,so=$("so").value;
let h="",shown=0;
D.forEach(([t,r])=>{
let rows=r.filter(x=>($("sc").value=="all"||x.f=="V"||x.f=="F")&&(!q||(x.a+" "+x.c.join(" ")).toLowerCase().includes(q))&&(!fd||x.d==fd)&&(!ff||x.f==ff)&&(!fc||x.c.includes(fc))&&(!fs||(fs=="d")==done.has(x.id)));
if(so)rows=[...rows].sort((a,b)=>FN[b.f][1]-FN[a.f][1]);
if(!rows.length)return;shown+=rows.length;
const dn=r.filter(x=>done.has(x.id)).length;
h+=`<details open><summary>${t}<small>${dn}/${r.length} done</small></summary><div class="wrap"><table><thead><tr><th>Done</th><th>Question</th><th>Difficulty</th><th>Companies</th><th>LeetCode</th><th>Frequency</th></tr></thead><tbody>`;
rows.forEach(x=>{const w=FN[x.f][1];
h+=`<tr class="${done.has(x.id)?"done":""}"><td><input type="checkbox" data-i="${x.id}" aria-label="Mark done" ${done.has(x.id)?"checked":""}></td><td class="q">${x.a}</td><td class="d-${x.d}">${DN[x.d]}</td><td><div class="co">${x.c.map(c=>`<span>${c}</span>`).join("")}</div></td><td>${x.l=="C"?"Custom":`<a href="https://leetcode.com/problemset/?search=${x.l}" target="_blank" rel="noopener">${x.l}</a>`}</td><td class="f" title="${FN[x.f][0]}">${[1,2,3,4].map(i=>`<i class="${i<=w?"on":""}"></i>`).join("")} ${FN[x.f][0]}</td></tr>`});
h+="</tbody></table></div></details>"});
$("out").innerHTML=h||'<div class="none">No questions match these filters.</div>';prog()}
$("out").addEventListener("change",e=>{const i=+e.target.dataset.i;if(isNaN(i))return;e.target.checked?done.add(i):done.delete(i);save();render()});
["q","sc","fd","ff","fc","fs","so"].forEach(i=>$(i).addEventListener("input",render));
$("rs").onclick=()=>{if(confirm("Clear all progress on this device?")){done.clear();save();render()}};
render();
</script></body></html>
